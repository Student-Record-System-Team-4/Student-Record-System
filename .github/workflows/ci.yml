name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr pkg-config libsodium-dev libsqlite3-dev

      - name: Configure project
        run: >
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          ${{ runner.os == 'Linux' && '-DSRS_ENABLE_COVERAGE=ON' || '' }}

      - name: Build project
        run: cmake --build build --config Debug --clean-first --parallel 2 --target student_record_system test_validator

      - name: Run tests
        run: ctest --test-dir build --build-config Debug --output-on-failure

      - name: Verify coverage
        if: runner.os == 'Linux'
        run: >
          gcovr --root . --object-directory build --gcov-executable gcov
          --filter 'src/' --exclude 'build/'
          --txt --html-details coverage.html --fail-under-line 75

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
