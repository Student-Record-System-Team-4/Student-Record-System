name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libsodium-dev libsqlite3-dev

      - name: Configure project
        run: >
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --config Debug --parallel 2 --target student_record_system test_validator

      - name: Run tests
        run: ctest --test-dir build --build-config Debug --output-on-failure
